<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ops Dashboard</title>
  <!-- Internal dashboard on a public host (D-92, D-115): keep it out of search engines and don't pass the address on to other sites.
       GitHub Pages can't set response headers, so these live in the page. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="SolarSquare Ops leadership dashboard: HOTO to installation to commissioning">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="side-brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="side-text">
          <div class="brand-title">Ops Dashboard</div>
          <div class="brand-sub">SolarSquare · Ops leadership</div>
        </div>
      </div>
      <nav class="side-nav" id="side-nav"></nav>
      <div class="side-foot">
        <div class="side-text side-asof" id="asof">Loading data…</div>
        <div class="side-actions">
          <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch light / dark theme" title="Light / dark"></button>
          <button class="icon-btn" id="collapse-toggle" type="button" aria-label="Collapse navigation" title="Collapse / expand"></button>
        </div>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar" id="topbar">
        <button class="icon-btn mobile-only" id="menu-toggle" type="button" aria-label="Open navigation"></button>
        <div class="page-title">
          <h1 id="page-title">Overview</h1>
          <div class="page-sub" id="page-sub"></div>
        </div>
        <div class="top-controls">
          <div id="period"></div>
          <div class="chips" id="chips" aria-label="Active filters"></div>
          <button class="filter-btn" id="filter-open" type="button" aria-haspopup="dialog" aria-controls="drawer">
            <span class="filter-icon" aria-hidden="true"></span><span>Filters</span><span class="badge" id="filter-count" hidden></span>
          </button>
        </div>
      </header>

      <main id="page" class="page" tabindex="-1">
        <div class="loading">Loading data…</div>
      </main>

      <footer class="footer">
        <span>Times in IST · TAT in calendar days · P50 / P90 like Sheets PERCENTILE · this month is compared with the same days of last month</span>
        <span id="footer-src"></span>
      </footer>
    </div>

    <div class="scrim" id="scrim" hidden></div>
    <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
      <div class="drawer-head">
        <h2 id="drawer-title">Filters</h2>
        <button class="icon-btn" id="filter-close" type="button" aria-label="Close filters">✕</button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
      <div class="drawer-foot">
        <button class="ghost-btn" id="filter-reset" type="button">Reset all</button>
        <button class="primary-btn" id="filter-done" type="button">Done</button>
      </div>
    </aside>
  </div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
